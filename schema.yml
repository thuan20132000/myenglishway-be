      description: 'Makes the exercise available to learners. Requires audio, a known
        duration, at least one segment whose timestamps fit inside that duration,
        and the `ready` status. A custom action rather than a PATCH of `is_published`:
        this is a state transition with preconditions, and folding it into partial
        update would mean running publish validation on every metadata edit.'
