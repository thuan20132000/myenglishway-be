          format: double
          readOnly: true
          nullable: true
          description: Audio length in seconds.
        language:
          type: string
          readOnly: true
        audio_url:
          type: string
          nullable: true
          readOnly: true
        pdf_url:
          type: string
          nullable: true
          readOnly: true
        segment_count:
          type: integer
          readOnly: true
        answer_count:
          type: integer
          readOnly: true
        collection:
