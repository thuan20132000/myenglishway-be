          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer_count
      - audio_url
      - collection
      - created_at
      - description
      - duration
      - id
      - is_published
      - language
      - owner
      - pdf_url
      - published_at
      - segment_count
      - status
      - title
      - updated_at
    ListeningExerciseList:
