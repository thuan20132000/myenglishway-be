      type: object
      description: Input for a dictation submission.
      properties:
        answer:
          type: string
          description: What the learner typed. An empty string is a valid answer and
            scores zero; null is rejected.
      required:
      - answer
    PracticeTranscriptSegment:
      type: object
      description: |-
        A transcript line, text included.

        Deliberately a separate class from ``PracticeSegmentSerializer`` rather than
        a flag on it. That serializer's guarantee is structural - it has no ``text``
        field, so the dictation payloads cannot leak the transcript by accident -
        and adding a conditional field would trade that guarantee for a runtime
        check. Worksheet mode wants the transcript openly, so it gets its own shape.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        text:
          type: string
          readOnly: true
          description: The reference transcript for this segment.
      required:
      - end_time
      - id
      - sequence
      - start_time
      - text
    Progress:
      type: object
      description: |-
        A learner's progress on one exercise.

        ``attempted`` counts distinct segments with at least one submission.
        ``completed`` counts distinct segments whose best submission reaches the
        configured threshold. ``average_score`` is the mean of each attempted
        segment's best score, so retrying can only raise it. Reveals are counted
        separately and never make a segment attempted or completed.
      properties:
        exercise_id:
          type: integer
          readOnly: true
        total_segments:
          type: integer
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        completed_segments:
          type: integer
          readOnly: true
        revealed_segments:
          type: integer
          readOnly: true
        progress_percentage:
          type: number
          format: double
          readOnly: true
        average_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        last_segment_sequence:
          type: integer
          readOnly: true
          nullable: true
        last_practiced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempted_segments
      - average_score
      - completed_segments
      - exercise_id
      - last_practiced_at
      - last_segment_sequence
      - progress_percentage
      - revealed_segments
      - total_segments
