      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listening exercise.
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePublication'
              examples:
                Published:
                  value:
                    id: 125
                    status: ready
                    is_published: true
                    published_at: '2026-08-19T10:00:00Z'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PreconditionsUnmet:
                  value:
                    code: EXERCISE_NOT_READY
                    detail: This exercise does not meet the requirements for publishing.
                    extra:
                      reasons:
                      - missing_duration
                      - no_segments
                  summary: Preconditions unmet
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
