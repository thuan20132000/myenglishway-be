                        position: 5
                      extra: []
                      incorrect: []
                      counts:
                        correct: 6
                        missing: 1
                        extra: 0
                        incorrect: 0
                        expected_total: 7
                    created_at: '2026-08-19T10:05:00Z'
                  summary: Scored result
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
components:
  schemas:
    AnswerKey:
      type: object
      description: |-
        The answer key, both as rows and as the text the creator pasted.

        ``answer_key`` is the write field and round-trips on read, so an edit form
        can load the key in the same shape it was authored rather than reassembling
        it from rows.
      properties:
        answer_key:
          type: string
          description: 'One answer per line, optionally numbered: ''1. library''.
            Number every line or none of them. Send an empty string to clear the key.'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseAnswer'
          readOnly: true
      required:
      - answer_key
      - answers
    AnswerKeyRequest:
      type: object
      description: |-
        The answer key, both as rows and as the text the creator pasted.

        ``answer_key`` is the write field and round-trips on read, so an edit form
        can load the key in the same shape it was authored rather than reassembling
        it from rows.
      properties:
        answer_key:
          type: string
          description: 'One answer per line, optionally numbered: ''1. library''.
            Number every line or none of them. Send an empty string to clear the key.'
      required:
      - answer_key
    AttemptExercise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - title
    AttemptSegment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
      required:
      - id
      - sequence
    CollectionCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        parent:
          type: integer
          nullable: true
          description: Omit for a root collection. The parent must be a root you own.
        position:
          type: integer
          minimum: 1
          description: 1-based position among siblings. Appended to the end if omitted.
      required:
      - title
    CollectionDetail:
      type: object
      description: |-
        Detail view: the folder plus one level of what is inside it.

        ``children`` and ``members`` are filtered to what the caller may see, so a
        student opening a published book gets only its published tests.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/CollectionRef'
          nullable: true
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        position:
          type: integer
          readOnly: true
          description: 1-based display order among siblings.
        child_count:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CollectionList'
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/ListeningExerciseList'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - child_count
      - children
      - created_at
      - description
      - id
      - is_published
      - member_count
      - members
      - owner
      - parent
      - position
      - published_at
      - title
      - updated_at
    CollectionList:
      type: object
      description: List rows. ``child_count``/``member_count`` come from queryset
        annotations.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        position:
          type: integer
          readOnly: true
          description: 1-based display order among siblings.
        child_count:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - child_count
      - created_at
      - id
      - is_published
      - member_count
      - owner
      - position
      - title
    CollectionMembersRequest:
      type: object
      description: |-
        The complete, ordered member list. Position is the index plus one.

        Ordered ids rather than explicit positions: the client states the order it
        wants and gaps or duplicate positions become unrepresentable.
      properties:
        exercise_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: Every exercise in the collection, in display order.
      required:
      - exercise_ids
    CollectionParent:
      type: object
      description: The grandparent rung of a breadcrumb - a book above a test.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - title
    CollectionPublication:
      type: object
      description: Response for the publish and unpublish transitions.
      properties:
        id:
          type: integer
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_published
      - published_at
    CollectionRef:
      type: object
      description: Where something is filed, as a breadcrumb rather than a nested
        tree.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/CollectionParent'
          readOnly: true
          nullable: true
      required:
      - id
      - parent
      - title
    Error:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        detail:
          type: string
          description: Human-readable explanation.
        extra:
          type: object
          additionalProperties: {}
          description: Structured detail specific to the error code.
      required:
      - code
      - detail
    ExerciseAnswer:
      type: object
      description: One entry of the answer key.
      properties:
        number:
          type: integer
          readOnly: true
          description: The question number as printed on the sheet.
        text:
          type: string
          readOnly: true
      required:
      - number
      - text
    ExerciseOwner:
      type: object
      description: Compact owner reference embedded in exercise payloads.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - full_name
      - id
    ExercisePublication:
      type: object
      description: Response for the publish and unpublish transitions.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_published
      - published_at
      - status
    ExerciseStatus:
      type: object
      description: |-
        Cheap polling target while transcription runs.

        Deliberately smaller than the detail payload: a client waiting for `ready`
        may hit this every few seconds.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        duration:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Audio length in seconds.
        segment_count:
          type: integer
          readOnly: true
        processing_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        processing_error:
          type: string
          readOnly: true
        transcription_provider:
          type: string
          readOnly: true
      required:
      - duration
      - id
      - is_published
      - processing_error
      - processing_started_at
      - segment_count
      - status
      - transcription_provider
    ExerciseStatusEnum:
      enum:
      - draft
      - uploaded
      - processing
      - ready
      - failed
      type: string
      description: |-
        * `draft` - Draft
        * `uploaded` - Uploaded
        * `processing` - Processing
        * `ready` - Ready
        * `failed` - Failed
    HistoryExercise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          nullable: true
        total_segments:
          type: integer
          readOnly: true
      required:
      - id
      - title
      - total_segments
    HistoryItem:
      type: object
      description: One exercise's worth of a learner's practice history.
      properties:
        exercise:
          allOf:
          - $ref: '#/components/schemas/HistoryExercise'
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        completed_segments:
          type: integer
          readOnly: true
        total_attempts:
          type: integer
          readOnly: true
        average_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        last_practiced_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempted_segments
      - average_score
      - completed_segments
      - exercise
      - last_practiced_at
      - total_attempts
    KindEnum:
      enum:
      - submission
      - reveal
      type: string
      description: |-
        * `submission` - Submission
        * `reveal` - Reveal
    ListeningExerciseCreateRequest:
      type: object
      description: Create input. ``owner``, ``status`` and ``is_published`` are derived.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        language:
          type: string
          minLength: 1
          maxLength: 10
        audio_file:
          type: string
          format: binary
          nullable: true
          description: 'Optional at creation. Allowed: .mp3, .m4a, .wav, .ogg.'
        pdf_file:
          type: string
          format: binary
          nullable: true
          description: Optional question sheet the learner reads while listening.
            PDF only, up to 20 MB.
        duration:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Audio length in seconds. Creator-supplied for now; the future
            transcription pipeline will set it automatically. Required before an exercise
            can be published.
      required:
      - title
    ListeningExerciseDetail:
      type: object
      description: Detail view. ``segments`` is present only for the owner or an admin.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Audio length in seconds.
        language:
          type: string
          readOnly: true
        audio_url:
          type: string
          nullable: true
          readOnly: true
        pdf_url:
          type: string
          nullable: true
          readOnly: true
        segment_count:
          type: integer
          readOnly: true
        answer_count:
          type: integer
          readOnly: true
        collection:
          allOf:
          - $ref: '#/components/schemas/CollectionRef'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer_count
      - audio_url
      - collection
      - created_at
      - description
      - duration
      - id
      - is_published
      - language
      - owner
      - pdf_url
      - published_at
      - segment_count
      - status
      - title
      - updated_at
    ListeningExerciseList:
      type: object
      description: List rows. Deliberately excludes description and segments.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        duration:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Audio length in seconds.
        language:
          type: string
          readOnly: true
        has_pdf:
          type: boolean
          readOnly: true
        segment_count:
          type: integer
          readOnly: true
        collection:
          allOf:
          - $ref: '#/components/schemas/CollectionRef'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - collection
      - created_at
      - duration
      - has_pdf
      - id
      - is_published
      - language
      - owner
      - segment_count
      - status
      - title
    LoginRequest:
      type: object
      description: |-
        Email/password exchange for a JWT pair.

        Written by hand rather than subclassing simplejwt's TokenObtainPairSerializer
        so the request/response shape is explicit in the schema and the error goes
        through the project's AuthenticationFailed path.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PaginatedCollectionListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CollectionList'
    PaginatedHistoryItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
    PaginatedListeningExerciseListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ListeningExerciseList'
    PaginatedPracticeAttemptList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAttempt'
    PatchedCollectionUpdateRequest:
      type: object
      description: |-
        Same fields as create; every one optional so PATCH works.

        ``is_published`` is absent on purpose - publication is a transition with
        its own endpoints, exactly as it is for exercises.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        parent:
          type: integer
          nullable: true
          description: Omit for a root collection. The parent must be a root you own.
        position:
          type: integer
          minimum: 1
          description: 1-based position among siblings. Appended to the end if omitted.
    PatchedListeningExerciseUpdateRequest:
      type: object
      description: Update input. Replacing audio is a state transition handled by
        the service.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        language:
          type: string
          minLength: 1
          maxLength: 10
        audio_file:
          type: string
          format: binary
          nullable: true
        pdf_file:
          type: string
          format: binary
          nullable: true
          description: Optional question sheet the learner reads while listening.
            PDF only, up to 20 MB.
        remove_pdf:
          type: boolean
          writeOnly: true
          description: Set true to detach the current PDF. Ignored when pdf_file is
            also sent. A flag rather than pdf_file=null because these uploads are
            multipart, which has no null.
        duration:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Audio length in seconds. Creator-supplied for now; the future
            transcription pipeline will set it automatically. Required before an exercise
            can be published.
    PatchedTranscriptSegmentCreatorRequest:
      type: object
      description: |-
        Full segment representation, including transcript text.

        Only ever served to the exercise owner or an admin. The practice API uses
        a different serializer that has no ``text`` field at all.
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Omit to append after the current highest sequence.
        start_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        text:
          type: string
          minLength: 1
          description: The reference transcript for this segment.
    PracticeAttempt:
      type: object
      description: One recorded attempt, as its own author sees it.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        exercise:
          allOf:
          - $ref: '#/components/schemas/AttemptExercise'
          readOnly: true
        segment:
          allOf:
          - $ref: '#/components/schemas/AttemptSegment'
          readOnly: true
        score:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 0-100. Null for reveals.
        user_answer:
          type: string
          readOnly: true
        result:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exercise
      - id
      - kind
      - result
      - score
      - segment
      - user_answer
    PracticeResult:
      type: object
      description: The scored outcome, including the transcript now that it is earned.
      properties:
        attempt_id:
          type: integer
          readOnly: true
        segment_id:
          type: integer
          readOnly: true
        score:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 0-100. Null for reveals.
        user_answer:
          type: string
          readOnly: true
        correct_answer:
          type: string
          readOnly: true
        result:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt_id
      - correct_answer
      - created_at
      - result
      - score
      - segment_id
      - user_answer
    PracticeSegment:
      type: object
      description: |-
        A segment as a learner sees it: timings only.

        There is deliberately no ``text`` field. Hiding the transcript is a
        structural property of this class rather than a runtime check, so it cannot
        leak through a context mistake or a forgotten condition.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        word_count:
          type: integer
          readOnly: true
      required:
      - end_time
      - id
      - sequence
      - start_time
      - word_count
    PracticeSegmentProgress:
      type: object
      description: |-
        A practice segment plus this learner's progress on it.

        Inherits the text-free field list rather than redeclaring it, so the
        transcript cannot reappear here by omission.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        word_count:
          type: integer
          readOnly: true
        attempted:
          type: boolean
          readOnly: true
        best_score:
          type: number
          format: double
          readOnly: true
          nullable: true
      required:
      - attempted
      - best_score
      - end_time
      - id
      - sequence
      - start_time
      - word_count
    PracticeStart:
      type: object
      description: Everything a client needs to open (or resume) an exercise.
      properties:
        exercise_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        audio_url:
          type: string
          readOnly: true
          nullable: true
        pdf_url:
          type: string
          readOnly: true
          nullable: true
        total_segments:
          type: integer
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        current_segment:
          allOf:
          - $ref: '#/components/schemas/PracticeSegment'
          readOnly: true
          nullable: true
      required:
      - attempted_segments
      - audio_url
      - current_segment
      - exercise_id
      - pdf_url
      - title
      - total_segments
    PracticeSubmissionRequest:
      type: object
      description: Input for a dictation submission.
      properties:
        answer:
          type: string
          description: What the learner typed. An empty string is a valid answer and
            scores zero; null is rejected.
      required:
      - answer
    PracticeTranscriptSegment:
      type: object
      description: |-
        A transcript line, text included.

        Deliberately a separate class from ``PracticeSegmentSerializer`` rather than
        a flag on it. That serializer's guarantee is structural - it has no ``text``
        field, so the dictation payloads cannot leak the transcript by accident -
        and adding a conditional field would trade that guarantee for a runtime
        check. Worksheet mode wants the transcript openly, so it gets its own shape.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        text:
          type: string
          readOnly: true
          description: The reference transcript for this segment.
      required:
      - end_time
      - id
      - sequence
      - start_time
      - text
    Progress:
      type: object
      description: |-
        A learner's progress on one exercise.

        ``attempted`` counts distinct segments with at least one submission.
        ``completed`` counts distinct segments whose best submission reaches the
        configured threshold. ``average_score`` is the mean of each attempted
        segment's best score, so retrying can only raise it. Reveals are counted
        separately and never make a segment attempted or completed.
      properties:
        exercise_id:
          type: integer
          readOnly: true
        total_segments:
          type: integer
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        completed_segments:
          type: integer
          readOnly: true
        revealed_segments:
          type: integer
          readOnly: true
        progress_percentage:
          type: number
          format: double
          readOnly: true
        average_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        last_segment_sequence:
          type: integer
          readOnly: true
          nullable: true
        last_practiced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempted_segments
      - average_score
      - completed_segments
      - exercise_id
      - last_practiced_at
      - last_segment_sequence
      - progress_percentage
      - revealed_segments
      - total_segments
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        full_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RegisterRoleEnum'
          default: student
          description: |-
            Only 'student' or 'creator' may be self-assigned.

            * `student` - Student
            * `creator` - Creator
      required:
      - email
      - password
    RegisterRoleEnum:
      enum:
      - student
      - creator
      type: string
      description: |-
        * `student` - Student
        * `creator` - Creator
    Reveal:
      type: object
      description: The transcript, released because the learner asked to give up.
      properties:
        attempt_id:
          type: integer
          readOnly: true
        segment_id:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        revealed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt_id
      - created_at
      - revealed
      - segment_id
      - text
    RoleEnum:
      enum:
      - student
      - creator
      - admin
      type: string
      description: |-
        * `student` - Student
        * `creator` - Creator
        * `admin` - Admin
    SegmentReorderItemRequest:
      type: object
      properties:
        id:
          type: integer
        sequence:
          type: integer
          minimum: 1
      required:
      - id
      - sequence
    SegmentReorderRequest:
      type: object
      description: |-
        Whole-list reassignment of segment sequences.

        Requires the complete set rather than a delta: a partial payload cannot be
        validated as collision-free without guessing what the client intended for
        the segments it left out.
      properties:
        ordering:
          type: array
          items:
            $ref: '#/components/schemas/SegmentReorderItemRequest'
      required:
      - ordering
    TokenPair:
      type: object
      description: Response shape for register and login.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
      - user
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Response shape for token refresh.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TranscriptSegmentCreator:
      type: object
      description: |-
        Full segment representation, including transcript text.

        Only ever served to the exercise owner or an admin. The practice API uses
        a different serializer that has no ``text`` field at all.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          minimum: 1
          description: Omit to append after the current highest sequence.
        start_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        text:
          type: string
          description: The reference transcript for this segment.
        word_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_time
      - id
      - start_time
      - text
      - updated_at
      - word_count
    TranscriptSegmentCreatorRequest:
      type: object
      description: |-
        Full segment representation, including transcript text.

        Only ever served to the exercise owner or an admin. The practice API uses
        a different serializer that has no ``text`` field at all.
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Omit to append after the current highest sequence.
        start_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          description: Seconds from the start of the audio.
        text:
          type: string
          minLength: 1
          description: The reference transcript for this segment.
      required:
      - end_time
      - start_time
      - text
    User:
      type: object
      description: Read representation of a user. Never accepts input.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - role
    Worksheet:
      type: object
      description: Everything the worksheet page needs in one request.
      properties:
        exercise_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        audio_url:
          type: string
          readOnly: true
          nullable: true
        pdf_url:
          type: string
          readOnly: true
          nullable: true
        duration:
          type: number
          format: double
          readOnly: true
          nullable: true
        question_numbers:
          type: array
          items:
            type: integer
          readOnly: true
        has_transcript:
          type: boolean
          readOnly: true
      required:
      - audio_url
      - duration
      - exercise_id
      - has_transcript
      - pdf_url
      - question_numbers
      - title
    WorksheetAnswer:
      type: object
      description: One answer from the key, fetched when the learner asks to see it.
      properties:
        number:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
      required:
      - number
      - text
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration, login and token renewal.
- name: listening
  description: Creator-facing exercise and transcript management. Payloads here contain
    transcript text and are restricted to the owner and admins.
- name: practice
  description: Learner-facing dictation. Segment representations never include transcript
    text; it is released on submit or reveal.
