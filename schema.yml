        A segment as a learner sees it: timings only.

        There is deliberately no ``text`` field. Hiding the transcript is a
        structural property of this class rather than a runtime check, so it cannot
        leak through a context mistake or a forgotten condition.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        word_count:
          type: integer
          readOnly: true
      required:
      - end_time
      - id
      - sequence
      - start_time
      - word_count
    PracticeSegmentProgress:
      type: object
      description: |-
        A practice segment plus this learner's progress on it.

        Inherits the text-free field list rather than redeclaring it, so the
        transcript cannot reappear here by omission.
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
          description: 1-based display order within the exercise.
        start_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
        end_time:
          type: number
          format: double
          readOnly: true
          description: Seconds from the start of the audio.
