      - me
      - next
      - previous
      - results
    LeaderboardUser:
      type: object
      description: A learner as they appear on the board. Email is deliberately absent.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - full_name
      - id
    ListeningExerciseCreateRequest:
      type: object
      description: Create input. ``owner``, ``status`` and ``is_published`` are derived.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        language:
          type: string
          minLength: 1
          maxLength: 10
        audio_file:
          type: string
          format: binary
          nullable: true
          description: 'Optional at creation. Allowed: .mp3, .m4a, .wav, .ogg.'
        pdf_file:
          type: string
          format: binary
          nullable: true
          description: Optional question sheet the learner reads while listening.
            PDF only, up to 20 MB.
        duration:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Audio length in seconds. Creator-supplied for now; the future
            transcription pipeline will set it automatically. Required before an exercise
            can be published.
      required:
      - title
    ListeningExerciseDetail:
      type: object
