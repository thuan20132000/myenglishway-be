          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WritingPageWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WritingPage'
              examples:
                AutosavedPage:
                  value:
                    page_number: 7
                    body: |-
                      1. however
                      2. nevertheless
                    word_count: 4
                    updated_at: '2026-08-26T10:04:12Z'
                  summary: Autosaved page
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
