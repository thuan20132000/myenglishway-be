      - created_at
      - description
      - has_notebook
      - id
      - is_published
      - language
      - last_page
      - owner
      - page_count
      - pages_started
      - pdf_url
      - published_at
      - source
      - title
      - updated_at
    WritingExerciseList:
      type: object
      description: 'List rows. No ``pdf_url``: media URLs live on the detail view.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
          description: Where the workbook came from - book title, publisher, unit.
        owner:
          allOf:
          - $ref: '#/components/schemas/OwnerRef'
          readOnly: true
        page_count:
          type: integer
          readOnly: true
          description: Read from the PDF on upload. Never supplied by the client.
        language:
          type: string
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        has_notebook:
          type: boolean
          readOnly: true
        pages_started:
          type: integer
          readOnly: true
        last_page:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - has_notebook
      - id
      - is_published
      - language
      - last_page
      - owner
      - page_count
      - pages_started
      - source
      - title
    WritingExercisePublication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_published
      - published_at
    WritingNotebook:
      type: object
      description: 'The whole notebook: every saved page, plus where to resume.'
      properties:
        id:
          type: integer
          readOnly: true
        exercise_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        pdf_url:
          type: string
          nullable: true
          readOnly: true
        page_count:
          type: integer
          readOnly: true
        pages_started:
          type: integer
          readOnly: true
        last_page:
          type: integer
          readOnly: true
          description: Where the learner left off, for resuming.
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the learner marks the workbook done. Never inferred.
        pages:
          type: array
          items:
            $ref: '#/components/schemas/WritingPage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - created_at
      - exercise_id
      - id
      - last_page
      - page_count
      - pages
      - pages_started
      - pdf_url
      - title
      - updated_at
    WritingNotebookList:
      type: object
      description: '"Continue writing" rows. No page bodies - just where to pick up.'
      properties:
        id:
          type: integer
          readOnly: true
        exercise_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        page_count:
          type: integer
          readOnly: true
        pages_started:
          type: integer
          readOnly: true
        last_page:
          type: integer
          readOnly: true
          description: Where the learner left off, for resuming.
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the learner marks the workbook done. Never inferred.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - exercise_id
      - id
      - last_page
      - page_count
      - pages_started
      - source
      - title
      - updated_at
    WritingPage:
      type: object
      properties:
        page_number:
          type: integer
          readOnly: true
        body:
          type: string
          readOnly: true
        word_count:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - page_number
      - updated_at
      - word_count
    WritingPageWriteRequest:
      type: object
      description: The autosave body. Blank is a real value - the learner cleared
        the page.
      properties:
        body:
          type: string
      required:
      - body
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration, login, Google sign-in and token renewal.
- name: listening
  description: Creator-facing exercise and transcript management. Payloads here contain
    transcript text and are restricted to the owner and admins.
- name: practice
  description: Learner-facing dictation. Segment representations never include transcript
    text; it is released on submit or reveal.
- name: writing
  description: 'PDF workbooks and the private notebooks learners keep against them.
    Nothing is scored: a page is saved, not submitted.'
- name: reading
  description: Paced-reading passages and append-only sessions. The client owns the
    WPM animation; the API stores the body, optional audio, target WPM and actual
    WPM.
