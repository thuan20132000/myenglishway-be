          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
components:
  schemas:
    AnswerKey:
      type: object
      description: |-
        The answer key, both as rows and as the text the creator pasted.

        ``answer_key`` is the write field and round-trips on read, so an edit form
        can load the key in the same shape it was authored rather than reassembling
        it from rows.
      properties:
        answer_key:
          type: string
          description: 'One answer per line, optionally numbered: ''1. library''.
            Number every line or none of them. Send an empty string to clear the key.'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseAnswer'
          readOnly: true
      required:
      - answer_key
      - answers
    AnswerKeyRequest:
      type: object
      description: |-
        The answer key, both as rows and as the text the creator pasted.

        ``answer_key`` is the write field and round-trips on read, so an edit form
        can load the key in the same shape it was authored rather than reassembling
        it from rows.
      properties:
        answer_key:
          type: string
          description: 'One answer per line, optionally numbered: ''1. library''.
            Number every line or none of them. Send an empty string to clear the key.'
      required:
      - answer_key
    AttemptExercise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - title
    AttemptSegment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
      required:
      - id
      - sequence
    CollectionCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        parent:
          type: integer
          nullable: true
          description: Omit for a root collection. The parent must be a root you own.
        position:
          type: integer
          minimum: 1
          description: 1-based position among siblings. Appended to the end if omitted.
      required:
      - title
    CollectionDetail:
      type: object
      description: |-
        Detail view: the folder plus one level of what is inside it.

        ``children`` and ``members`` are filtered to what the caller may see, so a
        student opening a published book gets only its published tests.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/CollectionRef'
          nullable: true
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        position:
          type: integer
          readOnly: true
          description: 1-based display order among siblings.
        child_count:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CollectionList'
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/ListeningExerciseList'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - child_count
      - children
      - created_at
      - description
      - id
      - is_published
      - member_count
      - members
      - owner
      - parent
      - position
      - published_at
      - title
      - updated_at
    CollectionList:
      type: object
      description: List rows. ``child_count``/``member_count`` come from queryset
        annotations.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/ExerciseOwner'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        position:
          type: integer
          readOnly: true
          description: 1-based display order among siblings.
        child_count:
          type: integer
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - child_count
      - created_at
      - id
      - is_published
      - member_count
      - owner
      - position
      - title
    CollectionMembersRequest:
      type: object
      description: |-
        The complete, ordered member list. Position is the index plus one.

        Ordered ids rather than explicit positions: the client states the order it
        wants and gaps or duplicate positions become unrepresentable.
      properties:
        exercise_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: Every exercise in the collection, in display order.
      required:
      - exercise_ids
    CollectionParent:
      type: object
      description: The grandparent rung of a breadcrumb - a book above a test.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - title
    CollectionPublication:
      type: object
      description: Response for the publish and unpublish transitions.
      properties:
        id:
          type: integer
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_published
      - published_at
    CollectionRef:
      type: object
      description: Where something is filed, as a breadcrumb rather than a nested
        tree.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/CollectionParent'
          readOnly: true
          nullable: true
      required:
      - id
      - parent
      - title
    Error:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        detail:
          type: string
          description: Human-readable explanation.
        extra:
          type: object
          additionalProperties: {}
          description: Structured detail specific to the error code.
      required:
      - code
      - detail
    ExerciseAnswer:
      type: object
      description: One entry of the answer key.
      properties:
        number:
          type: integer
          readOnly: true
          description: The question number as printed on the sheet.
        text:
          type: string
          readOnly: true
      required:
      - number
      - text
    ExerciseOwner:
      type: object
      description: Compact owner reference embedded in exercise payloads.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - full_name
      - id
    ExercisePublication:
      type: object
      description: Response for the publish and unpublish transitions.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - is_published
      - published_at
      - status
    ExerciseStatus:
      type: object
      description: |-
        Cheap polling target while transcription runs.

        Deliberately smaller than the detail payload: a client waiting for `ready`
        may hit this every few seconds.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExerciseStatusEnum'
          readOnly: true
        is_published:
          type: boolean
          readOnly: true
        duration:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Audio length in seconds.
        segment_count:
          type: integer
          readOnly: true
        processing_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        processing_error:
          type: string
          readOnly: true
        transcription_provider:
          type: string
          readOnly: true
      required:
      - duration
      - id
      - is_published
      - processing_error
      - processing_started_at
      - segment_count
      - status
      - transcription_provider
    ExerciseStatusEnum:
      enum:
      - draft
      - uploaded
      - processing
      - ready
      - failed
      type: string
      description: |-
        * `draft` - Draft
        * `uploaded` - Uploaded
        * `processing` - Processing
        * `ready` - Ready
        * `failed` - Failed
    GoogleLoginRequest:
      type: object
      description: A Google ID token from the browser, plus an optional role for signup.
      properties:
        id_token:
          type: string
          writeOnly: true
          minLength: 1
        role:
          allOf:
          - $ref: '#/components/schemas/SelfAssignableRoleEnum'
          default: student
          description: |-
            Applied only when this sign-in creates the account. Only 'student' or 'creator' may be self-assigned.

            * `student` - Student
            * `creator` - Creator
      required:
      - id_token
    GoogleTokenPair:
      type: object
      description: Response shape for Google sign-in.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        created:
          type: boolean
          readOnly: true
          description: True when this sign-in created the account.
      required:
      - access
      - created
      - refresh
      - user
    HistoryExercise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          nullable: true
        total_segments:
          type: integer
          readOnly: true
      required:
      - id
      - title
      - total_segments
    HistoryItem:
      type: object
      description: One exercise's worth of a learner's practice history.
      properties:
        exercise:
          allOf:
          - $ref: '#/components/schemas/HistoryExercise'
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        completed_segments:
          type: integer
          readOnly: true
        total_attempts:
          type: integer
          readOnly: true
        average_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        last_practiced_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempted_segments
      - average_score
      - completed_segments
      - exercise
      - last_practiced_at
      - total_attempts
    KindEnum:
      enum:
      - submission
      - reveal
      type: string
      description: |-
        * `submission` - Submission
        * `reveal` - Reveal
    LeaderboardEntry:
      type: object
      description: One learner's standing, ranked by scored submission count.
      properties:
        rank:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/LeaderboardUser'
          readOnly: true
        practice_count:
          type: integer
          readOnly: true
        attempted_segments:
          type: integer
          readOnly: true
        completed_segments:
          type: integer
          readOnly: true
        average_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        last_practiced_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempted_segments
      - average_score
      - completed_segments
      - last_practiced_at
      - practice_count
      - rank
      - user
    LeaderboardPage:
      type: object
      description: Paginated board plus the caller's own row, even when they are off-page.
      properties:
        count:
          type: integer
          readOnly: true
        next:
          type: string
          readOnly: true
          nullable: true
        previous:
          type: string
          readOnly: true
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
          readOnly: true
        me:
          allOf:
          - $ref: '#/components/schemas/LeaderboardEntry'
          readOnly: true
          nullable: true
