openapi: 3.0.3
info:
  title: IELTS Listening Practice API
  version: 1.0.0
  description: |2

    Backend API for uploading listening audio, managing timestamped transcript
    segments, and running dictation practice.

    ## Authentication

    Most endpoints require a JWT:

        Authorization: Bearer <access_token>

    Obtain a token pair from `POST /api/v1/auth/register/` or
    `POST /api/v1/auth/login/`, and renew the access token with
    `POST /api/v1/auth/token/refresh/`.

    The exceptions are registration, login, token refresh, and the read-only
    `public` endpoints, which any visitor may call without a token:

    | Endpoint | Returns |
    |---|---|
    | `GET /api/v1/listening/public/collections/` | Published root collections |
    | `GET /api/v1/listening/public/collections/{id}/` | One published collection with its published contents |
    | `GET /api/v1/listening/public/exercises/` | Published exercises (same filters as the authenticated list) |
    | `GET /api/v1/listening/public/exercises/{id}/` | One published exercise, transcript excluded |
    | `GET /api/v1/practice/public/exercises/{id}/segments/` | Segment playback windows, transcript excluded |

    They show published rows only, and anything unpublished returns 404. Scoring
    an answer, revealing a transcript and recording progress still need an account.

    ## Roles

    | Role | Can do |
    |---|---|
    | `student` | Practise published exercises, submit answers, view their own attempts |
    | `creator` | Everything a student can, plus author, edit and publish their own exercises |
    | `admin` | Full access to every exercise |

    Only `student` and `creator` may be chosen at registration.

    ## Transcript visibility

    Practice endpoints never return transcript text. A learner sees the reference
    transcript only in the response to `POST /practice/segments/{id}/submit/` or
    `POST /practice/segments/{id}/reveal/`. The creator-facing endpoints under
    `/listening/` do return transcripts, and are restricted to the exercise owner
    and admins.

    ## Errors

    Field validation keeps DRF's native shape with a top-level code added:

        {"code": "VALIDATION_ERROR", "title": ["This field is required."]}

    Everything else returns a stable machine-readable code:

        {"code": "EXERCISE_NOT_READY", "detail": "...", "extra": {"reasons": [...]}}

    | Code | Status | Meaning |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | One or more fields failed validation |
    | `AUTHENTICATION_FAILED` | 401 | Missing, invalid or expired credentials |
    | `TOKEN_INVALID` | 401 | The refresh token is expired or malformed |
    | `PERMISSION_DENIED` | 403 | Authenticated, but not allowed to do this |
    | `NOT_FOUND` | 404 | No such resource, or none the caller may see |
    | `INVALID_AUDIO_FILE` | 400 | Unsupported audio format or empty file |
    | `AUDIO_FILE_TOO_LARGE` | 400 | Audio exceeds the configured size limit |
    | `INVALID_SEGMENT_RANGE` | 400 | `end_time` <= `start_time`, or negative `start_time` |
    | `SEGMENT_OUTSIDE_AUDIO` | 400 | Segment extends past the known audio duration |
    | `DUPLICATE_SEGMENT_SEQUENCE` | 400 | Another segment already uses that sequence |
    | `EXERCISE_NOT_READY` | 409 | Publish preconditions unmet; see `extra.reasons` |
    | `EXERCISE_ALREADY_PUBLISHED` | 409 | Publish called on a published exercise |
    | `EXERCISE_NOT_PUBLISHED` | 409 | Practice attempted on an unpublished exercise |
    | `EXERCISE_PROCESSING` | 409 | Transcription is in flight; segments are locked |
    | `TRANSCRIPT_NOT_AVAILABLE` | 409 | The segment has no transcript to score against |
    | `COLLECTION_DEPTH_EXCEEDED` | 400 | Collections nest two levels deep at most |
    | `COLLECTION_CYCLE` | 400 | The requested parent would place a collection inside itself |
    | `COLLECTION_OWNER_MISMATCH` | 400 | The parent or exercise belongs to another user |
    | `COLLECTION_HAS_CHILDREN` | 409 | A collection of collections cannot also hold exercises |
    | `COLLECTION_HAS_MEMBERS` | 409 | A collection of exercises cannot also hold collections |
    | `EXERCISE_ALREADY_IN_COLLECTION` | 409 | That exercise is already filed elsewhere |
    | `COLLECTION_ALREADY_PUBLISHED` | 409 | Publish called on a published collection |

    Requesting a resource the caller may not see returns **404, not 403** - a 403
    would confirm that it exists.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Exchange email and password for an access and refresh token. Bad
        credentials and inactive accounts both return 401 - the response does not
        distinguish them.
      summary: Obtain a JWT pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the authenticated user, including their role.
      summary: Current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                CreatorProfile:
                  value:
                    id: 7
                    email: ben@example.com
                    full_name: Ben Ito
                    role: creator
                    date_joined: '2026-08-19T09:00:00Z'
                  summary: Creator profile
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Creates an account and returns a JWT pair, so a client can register and start working without a second round trip.

        `role` may be `student` (the default) or `creator`; `admin` is rejected and cannot be self-assigned. Passwords are checked against Django's configured password validators.
      summary: Register a new account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              StudentRegistration:
                value:
                  email: ann@example.com
                  password: s3cret-passphrase
                  full_name: Ann Lee
                  role: student
                summary: Student registration
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Exchange a valid refresh token for a new access token. Returns
        401 with `TOKEN_INVALID` if the refresh token is expired or malformed.
      summary: Refresh an access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/listening/collections/:
    get:
      operationId: listening_collections_list
      description: 'Only roots are listed: a child collection is reached by opening
        its parent. Students see published collections, creators additionally see
        their own in any state, admins see everything.'
      summary: List root collections visible to the caller
      parameters:
      - in: query
        name: is_published
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionListList'
              examples:
                OnePageOfResults:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 2
                      next: null
                      previous: null
                      results:
                      - id: 3
                        title: Cambridge IELTS 18
                        owner:
                          id: 3
                          full_name: Ben Ito
                        is_published: true
                        position: 1
                        child_count: 4
                        member_count: 0
                        created_at: '2026-08-19T09:00:00Z'
                  summary: One page of results
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
    post:
      operationId: listening_collections_create
      description: Creator role required. Omit `parent` for a root (a book, or a flat
        category); supply it to add a test to a book. Nesting stops there.
      summary: Create a collection
      tags:
      - listening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/collections/{id}/:
    get:
      operationId: listening_collections_retrieve
      description: '`children` holds nested collections, `members` the exercises filed
        directly here. A collection never has both. Each list is filtered to what
        the caller may see.'
      summary: Retrieve one collection with its contents
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise collection.
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
    patch:
      operationId: listening_collections_partial_update
      description: Owner or admin only. `is_published` cannot be set here - use the
        publish and unpublish actions. Setting `parent` re-files the collection; a
        collection that has children of its own cannot be moved under a parent, because
        its children would land three levels deep.
      summary: Edit a collection or move it under a new parent
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise collection.
        required: true
      tags:
      - listening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCollectionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCollectionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCollectionUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
    delete:
      operationId: listening_collections_destroy
      description: Owner or admin only. Child collections and memberships go with
        it; the exercises themselves are left alone and simply become ungrouped.
      summary: Delete a collection and its child collections
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise collection.
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/collections/{id}/members/:
    put:
      operationId: listening_collections_members_update
      description: Owner or admin only. Send every exercise that should be in the
        collection, in display order; position is the array index plus one. Exercises
        must be owned by the collection's owner and must not already belong to a different
        collection. A collection that holds child collections cannot hold exercises.
      summary: Replace the collection's member exercises
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMembersRequest'
            examples:
              FourPartsInOrder:
                value:
                  exercise_ids:
                  - 125
                  - 126
                  - 127
                  - 128
                summary: Four parts in order
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionMembersRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionMembersRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/collections/{id}/members/{exercise_id}/:
    delete:
      operationId: listening_collections_members_destroy
      description: Owner or admin only. The exercise itself is untouched and becomes
        ungrouped; the remaining members close the gap in the ordering.
      summary: Remove one exercise from the collection
      parameters:
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Removed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/collections/{id}/publish/:
    post:
      operationId: listening_collections_publish_create
      description: 'Lists the folder for learners. Unlike an exercise there are no
        preconditions - a collection holds no media to validate - and this does not
        cascade: the exercises inside keep whatever publication state they already
        had.'
      summary: Publish a collection
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise collection.
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/collections/{id}/unpublish/:
    post:
      operationId: listening_collections_unpublish_create
      description: Hides the folder. Idempotent. The member exercises stay published
        and individually practisable - this withdraws the shelf, not the material
        on it.
      summary: Unpublish a collection
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise collection.
        required: true
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPublication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/exercises/:
    get:
      operationId: listening_exercises_list
      description: Students see published exercises. Creators additionally see their
        own exercises in any status. Admins see everything. Segments are never included
        in list rows.
      summary: List exercises visible to the caller
      parameters:
      - in: query
        name: collection
        schema:
          type: number
      - in: query
        name: is_published
        schema:
          type: boolean
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: One of created_at, -created_at, title, -title, duration.
      - in: query
        name: owner
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches title and description.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - draft
          - failed
          - processing
          - ready
          - uploaded
        description: |-
          * `draft` - Draft
          * `uploaded` - Uploaded
          * `processing` - Processing
          * `ready` - Ready
          * `failed` - Failed
      - in: query
        name: ungrouped
        schema:
          type: boolean
      tags:
      - listening
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListeningExerciseListList'
              examples:
                OnePageOfResults:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 42
                      next: http://localhost:8000/api/v1/listening/exercises/?page=2
                      previous: null
                      results:
                      - id: 125
                        title: Accommodation Practice
                        owner:
                          id: 3
                          full_name: Ben Ito
                        status: ready
                        is_published: true
                        duration: 184.2
                        language: en
                        segment_count: 24
                        created_at: '2026-08-19T09:00:00Z'
                  summary: One page of results
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
    post:
      operationId: listening_exercises_create
      description: Creator role required. Audio may be uploaded now or added later.
      summary: Create an exercise
      tags:
      - listening
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListeningExerciseCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningExerciseDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUTHENTICATION_FAILED
                detail: Authentication credentials were not provided.
  /api/v1/listening/exercises/{exercise_id}/answers/:
    get:
      operationId: listening_exercises_answers_retrieve
      description: 'Owner or admin only, for reads as well as writes: this is the
        solution to the question sheet. Learners read the same answers through the
        practice API once the exercise is published.'
      summary: Read the answer key
      parameters:
